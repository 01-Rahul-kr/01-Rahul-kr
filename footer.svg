<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="1200" height="130" role="img" aria-label="Footer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="fbg" cx="50%" cy="50%" r="90%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <linearGradient id="fborder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF9C" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00FF9C" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
  <style>.mono{font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;}</style>

  <rect width="1200" height="130" rx="16" fill="url(#fbg)"/>
  <rect x="1" y="1" width="1198" height="128" rx="15" fill="none" stroke="url(#fborder)" stroke-width="1.5"/>

  <g transform="translate(1050,26)">
    <circle cx="8" cy="8" r="4" fill="#00FF9C">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="20" y="12" class="mono" font-size="12" fill="#00FF9C" font-weight="600" letter-spacing="1">OPEN TO COLLAB</text>
  </g>

  <text x="60" y="60" class="mono" font-size="14" fill="#64748b">$ echo "thanks for stopping by"</text>
  <text x="60" y="88" class="mono" font-size="17" fill="#f1f5f9" font-weight="600">
    Let's build something great together
    <tspan fill="#00FF9C">_</tspan>
    <animate attributeName="opacity" values="1;1" dur="1s"/>
  </text>
  <rect x="536" y="76" width="9" height="15" fill="#00FF9C">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
