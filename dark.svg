<svg width="1180" height="610" viewBox="0 0 1180 610" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="Vaibhav Khushalani — Creative Developer profile, dark theme terminal interface with links to GitHub, LinkedIn, portfolio, Medium, Instagram and YouTube" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="55%" stop-color="#07111F"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#10B981">
        <animate attributeName="offset" values="1;0.6;1" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="frameClip"><rect x="1" y="1" width="1178" height="608" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#frameClip)">
    <rect x="1" y="1" width="1178" height="608" rx="24" fill="url(#bg)"/>
    <circle cx="220" cy="150" r="220" fill="url(#glow)">
      <animate attributeName="cy" values="150;180;150" dur="10s" repeatCount="indefinite"/>
    </circle>
    <g stroke="#1E293B" stroke-width="1" opacity="0.35">
      <line x1="0" y1="152" x2="1180" y2="152"/>
      <line x1="452" y1="52" x2="452" y2="610"/>
    </g>
    <rect x="1" y="1" width="1178" height="608" rx="24" fill="none" stroke="url(#accent)" stroke-opacity="0.5" stroke-width="1.5"/>

    <!-- Terminal header -->
    <rect x="1" y="1" width="1178" height="50" fill="#0F172A" fill-opacity="0.55"/>
    <line x1="1" y1="51" x2="1179" y2="51" stroke="#1E293B" stroke-width="1"/>
    <circle cx="30" cy="26" r="6" fill="#EF4444"/>
    <circle cx="52" cy="26" r="6" fill="#F59E0B"/>
    <circle cx="74" cy="26" r="6" fill="#10B981"/>
    <text x="100" y="31" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#94A3B8">vaibhav@profile:~</text>
    <g>
      <circle cx="1130" cy="26" r="4" fill="#10B981">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="1000" y="31" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="12" letter-spacing="2" fill="#10B981" text-anchor="end">ONLINE</text>
    </g>

    <!-- LEFT: visual identity -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur=".6s" begin="0.1s" fill="freeze"/>
      <text x="226" y="95" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="11" letter-spacing="3" fill="#22D3EE">VISUAL.MAP</text>

      <rect x="66" y="120" width="320" height="320" rx="16" fill="#0F172A" fill-opacity="0.35" stroke="#1E293B" stroke-width="1"/>

      <!-- dot-matrix identity mark (no photo supplied, so a generated pattern stands in for a portrait) -->
      <g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="11" fill="#334155">
        <text x="226" y="240" text-anchor="middle" font-size="46" fill="#F8FAFC" font-weight="700" letter-spacing="2">VK</text>
        <g fill="#22D3EE" opacity="0.7">
          <animate attributeName="opacity" values="0.4;0.9;0.4" dur="4s" repeatCount="indefinite"/>
          <circle cx="130" cy="180" r="1.6"/><circle cx="150" cy="185" r="1.6"/><circle cx="170" cy="178" r="1.6"/>
          <circle cx="300" cy="300" r="1.6"/><circle cx="320" cy="295" r="1.6"/><circle cx="280" cy="310" r="1.6"/>
          <circle cx="150" cy="320" r="1.6"/><circle cx="310" cy="170" r="1.6"/>
        </g>
        <text x="226" y="290" text-anchor="middle" fill="#64748B" font-size="12">· : + * # % @ + : ·</text>
      </g>

      <text x="226" y="470" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="16" fill="#F8FAFC" font-weight="600">Creative Developer</text>
      <text x="226" y="494" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="12" fill="#94A3B8">AI Workflows · Cinematic Web</text>

      <text x="226" y="540" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="12" fill="#7C3AED">~/profile $ build --ship<tspan fill="#22D3EE">▌</tspan>
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- RIGHT: system info -->
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur=".6s" begin="0.3s" fill="freeze"/>
        <text x="490" y="100" font-size="38" font-weight="700" fill="#F8FAFC">Vaibhav Khushalani</text>
        <text x="490" y="128" font-size="15" fill="url(#accent)">@vaibhav.create</text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur=".6s" begin="0.5s" fill="freeze"/>
        <text x="490" y="176" font-size="11" letter-spacing="3" fill="#22D3EE">SYSTEM.INFO</text>
        <text x="490" y="196" font-size="12" fill="#64748B">user@developer:~$ ./profile.sh</text>

        <rect x="490" y="216" width="620" height="176" rx="14" fill="#0F172A" fill-opacity="0.30" stroke="#1E293B" stroke-width="1"/>
        <g font-size="13">
          <text x="512" y="248" fill="#64748B">&gt; NAME</text>
          <text x="640" y="248" fill="#E2E8F0">Vaibhav Khushalani</text>
          <text x="512" y="276" fill="#64748B">&gt; FOCUS</text>
          <text x="640" y="276" fill="#E2E8F0">AI Workflows · Cinematic Websites</text>
          <text x="512" y="304" fill="#64748B">&gt; BUILDING</text>
          <text x="640" y="304" fill="#E2E8F0">Cinematic Portfolio</text>
          <text x="512" y="332" fill="#64748B">&gt; CONTENT</text>
          <text x="640" y="332" fill="#E2E8F0">Creative dev &amp; AI workflow videos</text>
          <text x="512" y="360" fill="#64748B">&gt; STATUS</text>
          <text x="640" y="360" fill="#10B981">Open to connect</text>
        </g>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur=".6s" begin="0.7s" fill="freeze"/>
        <text x="490" y="424" font-size="11" letter-spacing="3" fill="#22D3EE">LINKS</text>
        <g font-size="13" fill="#94A3B8">
          <text x="490" y="450" fill="#E2E8F0">GitHub</text>
          <text x="600" y="450" fill="#E2E8F0">LinkedIn</text>
          <text x="720" y="450" fill="#E2E8F0">Portfolio</text>
          <text x="490" y="478" fill="#E2E8F0">Medium</text>
          <text x="600" y="478" fill="#E2E8F0">Instagram</text>
          <text x="720" y="478" fill="#E2E8F0">YouTube</text>
        </g>
        <text x="490" y="504" font-size="10" fill="#475569">see links below ↓</text>
      </g>
    </g>

    <rect x="66" y="560" width="1048" height="1" fill="#1E293B"/>
    <text x="66" y="585" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="11" fill="#475569">Code   Projects   Experience   Connect</text>
  </g>
</svg>
