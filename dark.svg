<svg width="1180" height="610" viewBox="0 0 1180 610" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rahul Kumar — Software Developer profile, dark theme terminal interface. Backend and Java full-stack development, Kolkata" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="55%" stop-color="#07111F"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#10B981">
        <animate attributeName="offset" values="1;0.6;1" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frameClip"><rect x="1" y="1" width="1178" height="608" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#frameClip)">
    <rect x="1" y="1" width="1178" height="608" rx="24" fill="url(#bg)"/>
    <circle cx="220" cy="150" r="220" fill="url(#glow)">
      <animate attributeName="cy" values="150;180;150" dur="10s" repeatCount="indefinite"/>
    </circle>
    <g stroke="#1E293B" stroke-width="1" opacity="0.35">
      <line x1="0" y1="152" x2="1180" y2="152"/>
      <line x1="452" y1="52" x2="452" y2="610"/>
    </g>
    <rect x="1" y="1" width="1178" height="608" rx="24" fill="none" stroke="url(#accent)" stroke-opacity="0.5" stroke-width="1.5"/>

    <!-- Terminal header -->
    <rect x="1" y="1" width="1178" height="50" fill="#0F172A" fill-opacity="0.55"/>
    <line x1="1" y1="51" x2="1179" y2="51" stroke="#1E293B" stroke-width="1"/>
    <circle cx="30" cy="26" r="6" fill="#EF4444"/>
    <circle cx="52" cy="26" r="6" fill="#F59E0B"/>
    <circle cx="74" cy="26" r="6" fill="#10B981"/>
    <text x="100" y="31" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#94A3B8">rahul@developer:~</text>
    <g>
      <circle cx="1130" cy="26" r="4" fill="#10B981">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="1000" y="31" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="12" letter-spacing="2" fill="#10B981" text-anchor="end">ONLINE</text>
    </g>

    <!-- LEFT: visual identity -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur=".6s" begin="0.1s" fill="freeze"/>
      <text x="226" y="95" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="11" letter-spacing="3" fill="#22D3EE">VISUAL.MAP</text>

      <rect x="66" y="120" width="320" height="320" rx="16" fill="#0F172A" fill-opacity="0.35" stroke="#1E293B" stroke-width="1"/>

      <g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="11" fill="#334155">
        <text x="226" y="240" text-anchor="middle" font-size="46" fill="#F8FAFC" font-weight="700" letter-spacing="2">RK</text>
        <g fill="#22D3EE" opacity="0.7">
          <animate attributeName="opacity" values="0.4;0.9;0.4" dur="4s" repeatCount="indefinite"/>
          <circle cx="130" cy="180" r="1.6"/><circle cx="150" cy="185" r="1.6"/><circle cx="170" cy="178" r="1.6"/>
          <circle cx="300" cy="300" r="1.6"/><circle cx="320" cy="295" r="1.6"/><circle cx="280" cy="310" r="1.6"/>
          <circle cx="150" cy="320" r="1.6"/><circle cx="310" cy="170" r="1.6"/>
        </g>
        <text x="226" y="290" text-anchor="middle" fill="#64748B" font-size="12">· : + * # % @ + : ·</text>
      </g>

      <text x="226" y="470" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="16" fill="#F8FAFC" font-weight="600">Software Developer</text>
      <text x="226" y="494" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="12" fill="#94A3B8">Backend · Java Full-Stack</text>

      <text x="226" y="540" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="12" fill="#7C3AED">~/profile $ build --ship<tspan fill="#22D3EE">▌</tspan>
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- RIGHT: system info -->
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur=".6s" begin="0.3s" fill="freeze"/>
        <text x="490" y="100" font-size="36" font-weight="700" fill="#F8FAFC">Rahul Kumar</text>
        <text x="490" y="128" font-size="15" fill="url(#accent)">Software Developer</text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur=".6s" begin="0.5s" fill="freeze"/>
        <text x="490" y="176" font-size="11" letter-spacing="3" fill="#22D3EE">SYSTEM.INFO</text>
        <text x="490" y="196" font-size="12" fill="#64748B">user@developer:~$ ./profile.sh</text>

        <rect x="490" y="216" width="620" height="206" rx="14" fill="#0F172A" fill-opacity="0.30" stroke="#1E293B" stroke-width="1"/>
        <g font-size="13">
          <text x="512" y="246" fill="#64748B">&gt; NAME</text>
          <text x="640" y="246" fill="#E2E8F0">Rahul Kumar</text>
          <text x="512" y="272" fill="#64748B">&gt; ROLE</text>
          <text x="640" y="272" fill="#E2E8F0">Software Developer</text>
          <text x="512" y="298" fill="#64748B">&gt; COMPANY</text>
          <text x="640" y="298" fill="#E2E8F0">Suropriyo Enterprises Pvt Ltd</text>
          <text x="512" y="324" fill="#64748B">&gt; LOCATION</text>
          <text x="640" y="324" fill="#E2E8F0">Kolkata, India</text>
          <text x="512" y="350" fill="#64748B">&gt; EXPERIENCE</text>
          <text x="640" y="350" fill="#E2E8F0">6 months</text>
          <text x="512" y="376" fill="#64748B">&gt; FOCUS</text>
          <text x="640" y="376" fill="#E2E8F0">Backend · Java Full-Stack</text>
          <text x="512" y="402" fill="#64748B">&gt; STACK</text>
          <text x="640" y="402" fill="#E2E8F0">Java · Spring Boot · React · PHP</text>
        </g>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur=".6s" begin="0.7s" fill="freeze"/>
        <text x="490" y="450" font-size="11" letter-spacing="3" fill="#22D3EE">STACK</text>
        <g font-size="11" fill="#CBD5E1">
          <rect x="490" y="462" width="62" height="24" rx="12" fill="#0F172A" fill-opacity="0.4" stroke="#334155"/><text x="521" y="478" text-anchor="middle">Java</text>
          <rect x="558" y="462" width="98" height="24" rx="12" fill="#0F172A" fill-opacity="0.4" stroke="#334155"/><text x="607" y="478" text-anchor="middle">Spring Boot</text>
          <rect x="662" y="462" width="68" height="24" rx="12" fill="#0F172A" fill-opacity="0.4" stroke="#334155"/><text x="696" y="478" text-anchor="middle">React</text>
          <rect x="736" y="462" width="98" height="24" rx="12" fill="#0F172A" fill-opacity="0.4" stroke="#334155"/><text x="785" y="478" text-anchor="middle">CodeIgniter</text>
          <rect x="840" y="462" width="60" height="24" rx="12" fill="#0F172A" fill-opacity="0.4" stroke="#334155"/><text x="870" y="478" text-anchor="middle">PHP</text>
          <rect x="906" y="462" width="76" height="24" rx="12" fill="#0F172A" fill-opacity="0.4" stroke="#334155"/><text x="944" y="478" text-anchor="middle">MySQL</text>
          <rect x="490" y="492" width="100" height="24" rx="12" fill="#0F172A" fill-opacity="0.4" stroke="#334155"/><text x="540" y="508" text-anchor="middle">PostgreSQL</text>
          <rect x="596" y="492" width="68" height="24" rx="12" fill="#0F172A" fill-opacity="0.4" stroke="#334155"/><text x="630" y="508" text-anchor="middle">HTML</text>
          <rect x="670" y="492" width="62" height="24" rx="12" fill="#0F172A" fill-opacity="0.4" stroke="#334155"/><text x="701" y="508" text-anchor="middle">CSS</text>
          <rect x="738" y="492" width="100" height="24" rx="12" fill="#0F172A" fill-opacity="0.4" stroke="#334155"/><text x="788" y="508" text-anchor="middle">JavaScript</text>
        </g>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur=".6s" begin="0.9s" fill="freeze"/>
        <text x="490" y="548" font-size="11" letter-spacing="3" fill="#22D3EE">LINKS</text>
        <g font-size="13" fill="#E2E8F0">
          <text x="490" y="572">GitHub</text>
          <text x="600" y="572">LinkedIn</text>
        </g>
        <text x="490" y="596" font-size="10" fill="#475569">see links below ↓</text>
      </g>
    </g>
  </g>
</svg>
