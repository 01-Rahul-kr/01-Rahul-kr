<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Rahul Kumar - Software Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bgGlow" cx="18%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="55%" stop-color="#080d17"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF9C" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00FF9C" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF9C"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
    <clipPath id="cardClip">
      <rect x="24" y="24" width="1152" height="352" rx="18"/>
    </clipPath>
  </defs>

  <style>
    .mono{font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;}
  </style>

  <rect width="1200" height="400" rx="20" fill="url(#bgGlow)"/>
  <rect width="1200" height="400" rx="20" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="398" rx="19" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- scanning sweep -->
  <g clip-path="url(#cardClip)">
    <line x1="24" y1="40" x2="1176" y2="40" stroke="#00FF9C" stroke-width="1" opacity="0.35">
      <animate attributeName="y1" values="40;360;40" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="40;360;40" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.05;0.4;0.05" dur="7s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- top bar -->
  <circle cx="48" cy="40" r="6" fill="#ef4444"/>
  <circle cx="68" cy="40" r="6" fill="#eab308"/>
  <circle cx="88" cy="40" r="6" fill="#22c55e"/>
  <text x="108" y="45" class="mono" font-size="13" fill="#94a3b8">rahul@dev-node:~ (main)</text>
  <g transform="translate(1050,32)">
    <circle cx="8" cy="8" r="4" fill="#00FF9C">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="20" y="12" class="mono" font-size="12" fill="#00FF9C" font-weight="600" letter-spacing="1">ONLINE</text>
  </g>
  <line x1="24" y1="64" x2="1176" y2="64" stroke="#1e293b" stroke-width="1"/>

  <!-- left: floating code glyph -->
  <g transform="translate(90,150)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -10; 0 0" dur="4s" repeatCount="indefinite"/>
      <text class="mono" font-size="88" fill="none" stroke="url(#nameGrad)" stroke-width="2" x="0" y="70">&lt;/&gt;</text>
    </g>
    <circle cx="45" cy="150" r="60" fill="none" stroke="#00FF9C" stroke-width="1" opacity="0.25">
      <animate attributeName="r" values="55;68;55" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.05;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- right: identity + typing lines -->
  <g transform="translate(300,130)">
    <text class="mono" font-size="40" font-weight="700" fill="url(#nameGrad)">RAHUL KUMAR</text>
    <text y="34" class="mono" font-size="15" fill="#64748b">$ whoami --role --focus</text>

    <g transform="translate(0,72)" class="mono" font-size="19" font-weight="600">
      <text opacity="0" fill="#f1f5f9">
        &gt; Software Developer_
        <animate attributeName="opacity" dur="12s" begin="0s" repeatCount="indefinite" keyTimes="0;0.02;0.23;0.25;1" values="0;1;1;0;0"/>
      </text>
      <text opacity="0" fill="#f1f5f9">
        &gt; Full-Stack Web Developer_
        <animate attributeName="opacity" dur="12s" begin="3s" repeatCount="indefinite" keyTimes="0;0.02;0.23;0.25;1" values="0;1;1;0;0"/>
      </text>
      <text opacity="0" fill="#f1f5f9">
        &gt; Open Source Enthusiast_
        <animate attributeName="opacity" dur="12s" begin="6s" repeatCount="indefinite" keyTimes="0;0.02;0.23;0.25;1" values="0;1;1;0;0"/>
      </text>
      <text opacity="0" fill="#f1f5f9">
        &gt; Building Scalable Web Apps_
        <animate attributeName="opacity" dur="12s" begin="9s" repeatCount="indefinite" keyTimes="0;0.02;0.23;0.25;1" values="0;1;1;0;0"/>
      </text>
    </g>

    <text y="112" class="mono" font-size="13" fill="#94a3b8">Building scalable web applications &amp; writing clean, maintainable code.</text>
  </g>

  <!-- bottom: tech pills, staggered fade+rise -->
  <g transform="translate(90,318)" class="mono" font-size="13" font-weight="500">
    <g transform="translate(0,0)" opacity="0">
      <animate attributeName="opacity" dur="0.6s" begin="0.1s" fill="freeze" values="0;1"/>
      <rect width="88" height="30" rx="7" fill="#0f172a" stroke="#334155"/>
      <circle cx="16" cy="15" r="4" fill="#f7df1e"/>
      <text x="28" y="20" fill="#cbd5e1">JavaScript</text>
    </g>
    <g transform="translate(98,0)" opacity="0">
      <animate attributeName="opacity" dur="0.6s" begin="0.25s" fill="freeze" values="0;1"/>
      <rect width="60" height="30" rx="7" fill="#0f172a" stroke="#334155"/>
      <circle cx="16" cy="15" r="4" fill="#f89820"/>
      <text x="28" y="20" fill="#cbd5e1">Java</text>
    </g>
    <g transform="translate(168,0)" opacity="0">
      <animate attributeName="opacity" dur="0.6s" begin="0.4s" fill="freeze" values="0;1"/>
      <rect width="66" height="30" rx="7" fill="#0f172a" stroke="#334155"/>
      <circle cx="16" cy="15" r="4" fill="#e34c26"/>
      <text x="28" y="20" fill="#cbd5e1">HTML5</text>
    </g>
    <g transform="translate(244,0)" opacity="0">
      <animate attributeName="opacity" dur="0.6s" begin="0.55s" fill="freeze" values="0;1"/>
      <rect width="60" height="30" rx="7" fill="#0f172a" stroke="#334155"/>
      <circle cx="16" cy="15" r="4" fill="#264de4"/>
      <text x="28" y="20" fill="#cbd5e1">CSS3</text>
    </g>
    <g transform="translate(314,0)" opacity="0">
      <animate attributeName="opacity" dur="0.6s" begin="0.7s" fill="freeze" values="0;1"/>
      <rect width="56" height="30" rx="7" fill="#0f172a" stroke="#334155"/>
      <circle cx="16" cy="15" r="4" fill="#f05033"/>
      <text x="28" y="20" fill="#cbd5e1">Git</text>
    </g>
    <g transform="translate(380,0)" opacity="0">
      <animate attributeName="opacity" dur="0.6s" begin="0.85s" fill="freeze" values="0;1"/>
      <rect width="78" height="30" rx="7" fill="#0f172a" stroke="#334155"/>
      <circle cx="16" cy="15" r="4" fill="#f1f5f9"/>
      <text x="28" y="20" fill="#cbd5e1">GitHub</text>
    </g>
    <g transform="translate(468,0)" opacity="0">
      <animate attributeName="opacity" dur="0.6s" begin="1s" fill="freeze" values="0;1"/>
      <rect width="88" height="30" rx="7" fill="#0f172a" stroke="#334155"/>
      <circle cx="16" cy="15" r="4" fill="#68a063"/>
      <text x="28" y="20" fill="#cbd5e1">Node.js</text>
    </g>
  </g>
</svg>
